[workspace]
resolver = "3"
members = ["crates/*"]
# The prompt pulls in GPUI; build it explicitly with `cargo build -p vp-gui`.
default-members = [
    "crates/vp-core",
    "crates/vp-crypto",
    "crates/vp-store",
    "crates/vp-native",
    "crates/vp-sync",
    "crates/vp-op",
    "crates/vp-daemon",
    "crates/vp-cli",
]

[workspace.package]
version = "0.10.3"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/VisiOffice/VisiPass"
rust-version = "1.85"

[workspace.dependencies]
vp-core = { path = "crates/vp-core" }
vp-op = { path = "crates/vp-op" }
vp-crypto = { path = "crates/vp-crypto" }
vp-store = { path = "crates/vp-store" }
vp-native = { path = "crates/vp-native" }
vp-sync = { path = "crates/vp-sync" }
vp-daemon = { path = "crates/vp-daemon" }
aho-corasick = "1.1"
psl = "2"
url = "2.5"
argon2 = { version = "0.5.3", features = ["zeroize"] }
chacha20poly1305 = "0.10.1"
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
hkdf = "0.12.4"
rusqlite = { version = "0.32", features = ["bundled"] }
unicode-normalization = "0.1.25"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.9"
clap = { version = "4.5", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
hmac = "0.12"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
zeroize = { version = "1", features = ["derive"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
strip = true

# Argon2 at the test parameters (64 MiB) takes seconds unoptimised.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
