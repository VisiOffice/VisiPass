[workspace]
resolver = "3"
members = ["crates/*"]
# The prompt pulls in GPUI; build it explicitly with `cargo build -p vp-gui`.
default-members = ["crates/vp-core", "crates/vp-op", "crates/vp-daemon", "crates/vp-cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/VisiOffice/VisiPass"
rust-version = "1.85"

[workspace.dependencies]
vp-core = { path = "crates/vp-core" }
vp-op = { path = "crates/vp-op" }
vp-daemon = { path = "crates/vp-daemon" }
aho-corasick = "1.1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
hmac = "0.12"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
strip = true
