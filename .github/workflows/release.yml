name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    # 22.04 keeps the glibc requirement low enough for older distributions.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the crate version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1; }
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release -p vp-cli -p vp-daemon -p vp-gui
      - name: Package
        run: |
          name="visipass-${GITHUB_REF_NAME#v}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/vp target/release/visipassd target/release/visipass-prompt target/release/visipass-app "dist/$name/"
          cp LICENSE README.md SECURITY.md "dist/$name/"
          cp skills/visipass/SKILL.md "dist/$name/SKILL.md"
          cp packaging/linux/visipass.desktop assets/brand/visipass.svg "dist/$name/"
          mkdir -p "dist/$name/icons" && cp assets/icons/visipass-*.png "dist/$name/icons/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in 0.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "VisiPass $version" --generate-notes $prerelease
