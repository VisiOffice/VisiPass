[package]
name = "vp-phone"
description = "VisiPass phone approvals: the messages between visipassd and a paired phone, and their sealing and signing. No I/O."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
hmac.workspace = true
hpke = { version = "0.13", default-features = false, features = ["alloc", "p256"] }
p256.workspace = true
rand_core = { version = "0.9", features = ["os_rng"] }
sha2.workspace = true
vp-crypto.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
