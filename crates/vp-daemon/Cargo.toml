[package]
name = "vp-daemon"
description = "visipassd: holds grants, asks the human, keeps the access log."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "visipassd"
path = "src/main.rs"

[dependencies]
base64.workspace = true
futures-util.workspace = true
image.workspace = true
libc.workspace = true
rqrr.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
vp-core.workspace = true
vp-native.workspace = true
vp-phone.workspace = true
qrcode.workspace = true
vp-crypto.workspace = true
vp-sync.workspace = true
vp-op.workspace = true
zeroize.workspace = true
zbus.workspace = true
zip = { version = "6", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client.workspace = true
wayland-protocols.workspace = true

[dev-dependencies]
hpke = { version = "0.13", default-features = false, features = ["alloc", "p256"] }
p256.workspace = true
tempfile.workspace = true
